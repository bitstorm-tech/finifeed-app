services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finifeed
      POSTGRES_PASSWORD: finifeed
      POSTGRES_DB: finifeed
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finifeed -d finifeed"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
